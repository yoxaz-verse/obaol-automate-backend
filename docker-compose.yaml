services:
  backend:
    build: .
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/obaol}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      BASE_URL: ${BASE_URL:-http://localhost:5001}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:?Set SMTP_AUTH_PASSWORD in .env}
      SMTP_AUTH_USER: ${SMTP_AUTH_USER:?Set SMTP_AUTH_USER in .env}
      SMTP_NOTIFY_USER: ${SMTP_NOTIFY_USER:?Set SMTP_NOTIFY_USER in .env}
      SMTP_SUPPORT_USER: ${SMTP_SUPPORT_USER:?Set SMTP_SUPPORT_USER in .env}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
